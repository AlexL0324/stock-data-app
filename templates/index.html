<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stock Data Visualizer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1150px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; grid-template-columns: 200px 1fr; gap: .6rem; max-width: 500px; }
    select, input, button { padding: .4rem; }
    button { grid-column: 1 / -1; cursor: pointer; }
    .error { background: #fde8e8; color: #9b1c1c; padding: .8rem; border-radius: 6px; margin: 1rem 0; max-width: 500px; }
    embed { width: 100%; height: 620px; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>Stock Data Visualizer</h1>
  <form method="post">
    <label for="symbol">Stock symbol</label>
    <select name="symbol" id="symbol" required>
      {% for s in symbols %}
      <option value="{{ s }}" {{ 'selected' if form.get('symbol') == s }}>{{ s }}</option>
      {% endfor %}
    </select>

    <label for="chart_type">Chart type</label>
    <select name="chart_type" id="chart_type" required>
      {% for key, (label, _) in chart_types.items() %}
      <option value="{{ key }}" {{ 'selected' if form.get('chart_type') == key }}>{{ label }}</option>
      {% endfor %}
    </select>

    <label for="time_series">Time series</label>
    <select name="time_series" id="time_series" required>
      {% for key, info in time_series.items() %}
      <option value="{{ key }}" {{ 'selected' if form.get('time_series') == key }}>{{ info[0] }}</option>
      {% endfor %}
    </select>

    <label for="start_date">Begin date</label>
    <input type="date" name="start_date" id="start_date" value="{{ form.get('start_date', '') }}" required>

    <label for="end_date">End date</label>
    <input type="date" name="end_date" id="end_date" value="{{ form.get('end_date', '') }}" required>

    <button type="submit">Generate chart</button>
  </form>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if chart_uri %}<embed type="image/svg+xml" src="{{ chart_uri|safe }}">{% endif %}
</body>
</html>
